name: Sync AIO CODE to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub source of truth
        uses: actions/checkout@v6

      - name: Validate export manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("data-export/export-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          sources = manifest.get("sources", [])
          if not sources:
              raise SystemExit("Export manifest contains no sources")

          missing = [p for p in sources if not Path(p).is_file()]
          if missing:
              print("Missing export sources:")
              for path in missing:
                  print(f"- {path}")
              raise SystemExit(1)

          print(f"Validated {len(sources)} export sources")
          PY

      - name: Build controlled Hugging Face export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hf-export
          mkdir -p hf-export
          cp data-export/README.md hf-export/README.md
          cp data-export/export-manifest.json hf-export/export-manifest.json

          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest = json.loads(Path("data-export/export-manifest.json").read_text(encoding="utf-8"))
          destination = Path("hf-export")

          for source in manifest["sources"]:
              src = Path(source)
              dst = destination / src
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          print(f"Built controlled export with {len(manifest['sources'])} source files")
          PY

      - name: Sync controlled export to Hugging Face Dataset
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: mariicuadros/aio-code-entities
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: dataset
          subdirectory: hf-export
