name: Sync AIO CODE to Hugging Face

# Merging/pushing must not publish. A separate founder-authorized dispatch is required.
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full 40-character main commit approved for this run
        required: true
        type: string
      publish_approved:
        description: Publish BOTH datasets only after explicit founder authorization
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: huggingface-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require manual main request for the approved commit
        run: python scripts/validate_release_safety.py --request

      - name: Validate canonical data contracts
        run: |
          python -m pip install 'jsonschema>=4.23,<5' 'PyYAML>=6,<7'
          python scripts/validate_release_safety.py
          python scripts/validate_core.py
          python scripts/validate_intake.py
          python scripts/validate_brain.py brain/contracts/examples.synthetic.json
          python scripts/validate_entities.py
          python scripts/validate_site.py
          python scripts/build_public_rag.py --check
          python -m unittest discover -s tests -v
          python -m rag.evaluate

      - name: Validate export manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("data-export/export-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          sources = manifest.get("sources", [])
          if not sources:
              raise SystemExit("Export manifest contains no sources")

          missing = [p for p in sources if not Path(p).is_file()]
          if missing:
              print("Missing export sources:")
              for path in missing:
                  print(f"- {path}")
              raise SystemExit(1)

          print(f"Validated {len(sources)} export sources")
          PY

      - name: Build controlled Hugging Face export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hf-export/source-artifacts
          cp data-export/README.md hf-export/README.md
          cp data-export/export-manifest.json hf-export/source-artifacts/export-manifest.json

          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("data-export/export-manifest.json").read_text(encoding="utf-8"))
          destination = Path("hf-export/source-artifacts")

          for source in manifest["sources"]:
              src = Path(source)
              dst = destination / src
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          subprocess.run(["python", "scripts/build_hf_entities.py", "--output", "hf-export/data/entities.jsonl"], check=True)
          print(f"Built controlled export with {len(manifest['sources'])} source files and canonical entity rows")
          PY

      - name: Retain validated export for this run
        uses: actions/upload-artifact@v4
        with:
          name: hf-export-${{ github.sha }}
          path: hf-export/
          retention-days: 7

  publish:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_approved == true && inputs.approved_commit == github.sha
    runs-on: ubuntu-latest
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
    steps:
      - name: Checkout the same approved commit for journal preparation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recheck manual main request before any HF access
        run: python scripts/validate_release_safety.py --request
      - name: Download the validated export from this run
        uses: actions/download-artifact@v4
        with:
          name: hf-export-${{ github.sha }}
          path: hf-export/

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub PyYAML

      - name: Verify Hugging Face authentication and dataset access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          if not token:
              raise SystemExit("HF_TOKEN secret is empty or unavailable")

          api = HfApi(token=token)
          user = api.whoami()
          username = user.get("name") or user.get("fullname") or "unknown"
          print(f"Authenticated to Hugging Face as: {username}")

          repo_id = "mariicuadros/aio-code-entities"
          try:
              info = api.dataset_info(repo_id=repo_id)
              journal_info = api.dataset_info(repo_id="mariicuadros/aio-code-journal")
              print(f"Dataset access confirmed: {info.id}; journal access confirmed: {journal_info.id}")
          except Exception as exc:
              print(f"Dataset access check failed: {type(exc).__name__}: {exc}")
              raise
          PY

      - name: Ensure Hugging Face dataset exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(
              repo_id="mariicuadros/aio-code-entities",
              repo_type="dataset",
              exist_ok=True,
          )
          print("Dataset repository is ready")
          PY

      - name: Upload controlled export to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="mariicuadros/aio-code-entities",
              repo_type="dataset",
              folder_path="hf-export",
              commit_message="Sync controlled OZCU / AIO CODE export from GitHub",
          )
          print("Controlled export uploaded successfully")
          PY


      - name: Prepare append-only Hugging Face journal update
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p hf-journal-export/data
          cp data-export/journal-addendum.jsonl hf-journal-export/data/research-journal-addendum.jsonl
          python scripts/prepare_hf_journal_card.py --output hf-journal-export/README.md

      - name: Upload append-only journal update
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="mariicuadros/aio-code-journal",
              repo_type="dataset",
              folder_path="hf-journal-export",
              commit_message="Append dated OZCU / AIO CODE journal records",
          )
          print("Append-only journal update uploaded successfully")
          PY
